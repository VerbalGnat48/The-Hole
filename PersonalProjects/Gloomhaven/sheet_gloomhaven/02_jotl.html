<!DOCTYPE html>
<html>
<head>
	<title>JoTL Stat Tracker</title>
	<link rel="stylesheet" href="gloom.css">
</head>
<style>
	table, th, td {
		border:1px solid white;
	}
</style>
<body onload="getCharacters()">
	<div class="page-container" style="flex-direction:row; column-gap:10px; justify-content: space-evenly;">
		<!--Characters-->
		<div class="box-container" id="Character_Box_Container" style="column-gap:25px; row-gap:25px; flex-direction:column;"></div>

		<!--Sheets-->
		<div class="box-tall" id="Sheet_Box" style="row-gap:25px;">
			<!--Demolitionist Sheet-->
			<table style="max-width:1200px;" id="Demolitionist_Sheet"></table>

			<!--Hatchet Sheet-->
			<table style="max-width:1200px;" id="Hatchet_Sheet"></table>

			<!--RedGuard Sheet-->
			<table style="max-width:1200px;" id="RedGuard_Sheet"></table>

			<!--Void Warden Sheet-->
			<table style="max-width:1200px;" id="Voidwarden_Sheet"></table>

			<div class="box-long" style="column-gap:10px;">
				<input type="number" id="sheetRangeMin" value="2" style="width:25px;">
				<button onclick="nextRound()">Next Round</button>
				<input type="number" id="sheetRangeMax" value="0" style="width:25px;">
			</div>
			<button onclick="previousRound()">Previous Round</button>
		</div>

		<!--Enemies-->
		<div class="box-tall" id="Enemy_Container" style="height:100vh; justify-content:flex-start;">
			<div class="box-long" style="column-gap:10px;">
				<select name="enemies" id="Enemy_Selector"></select>
				<select name="levels" id="Enemy_Selector_Levels"></select>
				<img src="./Images/Icons/Normal.png" class="enemy-selector" id="Add_Enemy" onclick="addEnemy(this.id)">
				<img src="./Images/Icons/Elite.png" class="enemy-selector" id="Add_Enemy_Elite" onclick="addEnemy(this.id)">
			</div>
			<div class="box-long" style="column-gap:10px;">
				<img src="./Images/Icons/Attack.png" class="enemy-selector" id="Attack_Player">
			</div>
			<div class="box-enemy" id="Enemy_Box" style="position:relative;">
			</div>
		</div>

	</div>
	<script src="./jotl.js"></script>
</body>
</html>
