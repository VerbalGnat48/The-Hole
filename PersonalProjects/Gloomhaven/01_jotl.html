<!DOCTYPE html>
<html>
<head>
	<title>JoTL Stat Tracker</title>
	<link rel="stylesheet" href="gloom.css">
</head>
<body>
	<div class="page-container" style="row-gap:25px;">
		<!--Characters-->
		<div class="box-container">
			<h1 style="font-family:PirataOne;">Characters</h1>
		</div>
		<div class="box-container" style="column-gap:25px; row-gap:25px;">
			<!--Demolitionist-->
			<div class="box-tall" id="Demolitionist_Box" data-selected="false" data-level="1" data-color="1px #ebb96e" style="position:relative;">
				<img src="./Images/JoTL/Demolitionist_Front.png" id="Demolitionist_Card" width="400" height="600">
				<button class="character-flipper" id="Demolitionist_Flipper" onclick="flipCharacterCard(this.id)" style="left:27px; top:78px;"></button>
				<button class="character-level-selector" id="Demolitionist_Level_1" onclick="selectCharacterLevel(this.id)" style="left:41px; top:524px;">1</button>
				<button class="character-level-selector" id="Demolitionist_Level_2" onclick="selectCharacterLevel(this.id)" style="left:67px; top:524px;">2</button>
				<button class="character-level-selector" id="Demolitionist_Level_3" onclick="selectCharacterLevel(this.id)" style="left:93px; top:524px;">3</button>
				<button class="character-level-selector" id="Demolitionist_Level_4" onclick="selectCharacterLevel(this.id)" style="left:119px; top:524px;">4</button>
				<button class="character-level-selector" id="Demolitionist_Level_5" onclick="selectCharacterLevel(this.id)" style="left:145px; top:524px;">5</button>

				<button class="character-level-selector" id="Demolitionist_Level_8" onclick="selectCharacterLevel(this.id)" style="left:223px; top:524px;">8</button>
				<button class="character-level-selector" id="Demolitionist_Level_9" onclick="selectCharacterLevel(this.id)" style="left:249px; top:524px;">9</button>
				<p class="character-selector-label" id="Demolitionist_Select">Select</p>
				<img src="./Images/Icons/Null.png" class="character-selector" id="Demolitionist_Selector" onclick="selectCharacterStatus(this.id)">
			</div>

				<img src="./Images/Icons/Null.png" class="character-selector" id="Voidwarden_Selector" onclick="selectCharacterStatus(this.id)">
			</div>
		</div>

		<!--Begin Button-->
		<div class="box-container">
			<button class="box" onclick="setCharacters()">Start</button>
		</div>

	</div>
	<script src="./jotl.js"></script>
</body>
</html>
