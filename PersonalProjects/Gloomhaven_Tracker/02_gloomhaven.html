<!DOCTYPE html>
<html>
<head>
	<title>Gloomhaven Character and Enemy Tracker</title>
	<link rel="stylesheet" href="gloom.css">
</head>
<style>
	table, th, td {
		border:1px solid white;
	}
</style>
<body onload="makeSelectedCharacters(); setDifficulty()">
	<div class="page-container" style="flex-direction:row; column-gap:10px; justify-content:space-evenly; min-width:100%;">
		<!--Characters-->
		<div class="box-long" style="column-gap:10px;">
			<div class="box-tall" id="Conditions" style="row-gap:25px; flex-direction:column; min-height:75vh; border:1px solid white;">
				<img src="./Images/Conditions/Safeguard.png" id="Safeguard" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Ward.png" id="Ward" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Invisible.png" style="border:1px solid chartreuse" id="Invisible" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Strengthen.png" id="Strengthen" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Wound.png" id="Wound" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Poison.png" id="Poison" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Immobilize.png" id="Immobilize" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Disarm.png" id="Disarm" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Stun.png" id="Stun" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Muddle.png" id="Muddle" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Doom.png" id="Doom" class="condition" ondragstart="dragstartHandler(event)">
				<img src="./Images/Conditions/Plague.png" id="Plague" class="condition" ondragstart="dragstartHandler(event)">
			</div>
			<div class="box-container" id="Character_Box_Container" style="column-gap:25px; row-gap:25px; flex-direction:column; min-height:100vh;">
				<div class="box-tall" style="column-gap:20px;">
					<div class="box-long" style="column-gap:20px;">
						<p id="Next_Round_Btn" onclick="nextRound()" style="margin-top:50px; cursor:pointer;">Start Round (Enter)</p>
						<p id="Round_Tracker" style="margin-top:50px; cursor:pointer;">0</p>
						<p id="Next_Play_Btn" onclick="highlightPlay()" style="margin-top:50px; cursor:pointer;">Next Turn/Action (Q)</p>
					</div>
					<div class="box-long" style="column-gap:20px;">
						<img src="./Images/Conditions/Pierce.png" class="action-BtnD" style="margin-top:30px; height:40px;" id="pPB" onclick="playerPierceToggle(this.id)">
						<div class="box-long" style="margin-top:30px; height:40px;">
							<p id="playerPierce" class="attribute-input">2</p>
							<div class="box-tall">
								<img src="./Images/Icons/Arrow.png" onclick="addPierce()" style="width:10px;height:10px; cursor:pointer;">
								<img src="./Images/Icons/Arrow.png" onclick="subPierce()" style="width:10px;height:10px; rotate:180deg; cursor:pointer;">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!--Elements-->
		<div class="box-tall">
			<div class="box-tall" style="row-gap:10px;">
				<!--Strong-->
				<div class="element-box" id="Strong" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
				<div class="box-long" style="height:50px;width:250px;">
					<img src="./Images/Icons/Arrow.png" onclick="moveElementsFrom('Waning', 'Strong')" style="width:50px;height:50px; cursor:pointer;">
					<img src="./Images/Icons/Arrow.png" onclick="moveElementsFrom('Strong', 'Waning')" style="width:50px;height:50px; cursor:pointer; rotate:180deg;">
				</div>
				<!--Waning-->
				<div class="element-box" id="Waning" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"></div>
				<div class="box-long" style="height:50px;width:250px;">
					<img src="./Images/Icons/Arrow.png" onclick="moveElementsFrom('Inert', 'Waning')" style="width:50px;height:50px; cursor:pointer;">
					<img src="./Images/Icons/Arrow.png" onclick="moveElementsFrom('Waning', 'Inert')" style="width:50px;height:50px; cursor:pointer; rotate:180deg;">
				</div>
				<!--Inert-->
				<div class="element-box" id="Inert" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)">
					<img src="./Images/Icons/Elements/Fire.png" id="Fire" class="element" ondragstart="dragstartHandler(event)">
					<img src="./Images/Icons/Elements/Ice.png" id="Ice" class="element" ondragstart="dragstartHandler(event)">
					<img src="./Images/Icons/Elements/Grass.png" id="Grass" class="element" ondragstart="dragstartHandler(event)">
					<img src="./Images/Icons/Elements/Wind.png" id="Wind" class="element" ondragstart="dragstartHandler(event)">
					<img src="./Images/Icons/Elements/Dark.png" id="Dark" class="element" ondragstart="dragstartHandler(event)">
					<img src="./Images/Icons/Elements/Light.png" id="Light" class="element" ondragstart="dragstartHandler(event)">
				</div>
			</div>
		</div>

		<!--Enemies-->
		<div class="box-long" style="column-gap:20px;">
			<div class="box-tall">
				<div class="box-long" style="column-gap:20px;">
					<p onclick="shuffleEnemyAll()" style="margin-top:50px; cursor:pointer;">Shuffle All</p>
					<p onclick="flipEnemyAll()" style="margin-top:50px; cursor:pointer;">Flip All</p>
				</div>
				<div class="box-long" style="column-gap:20px;">
					<p>Flip Modifier Deck (E)</p>
				</div>
				<div class="box-tall" id="Enemy_Stat_Box" style="height:90vh;min-width:500px;max-width:2000; row-gap:15px;column-gap:25px; border-right:3px solid white;"></div>
			</div>
			<div class="box-tall" id="Enemy_Container" style="height:100vh; justify-content:flex-start;">
				<div class="box-long" style="column-gap:10px;">
					<select name="enemies" id="Enemy_Selector"></select>
					<select name="levels" id="Enemy_Selector_Levels"></select>
					<img src="./Images/Icons/Normal.png" class="enemy-selector" id="Add_Enemy" onclick="addEnemy('normal')">
					<img src="./Images/Icons/Elite.png" class="enemy-selector" id="Add_Enemy_Elite" onclick="addEnemy('elite')">
					<select name="summones" id="Enemy_Selector_Summons">
						<option value="false">Not Summoned</option>
						<option value="true">Summoned</option>
					</select>
				</div>
				<div class="box-long" style="column-gap:10px;">
					<div class="box-tall" style="row-gap:10px;">
						<img src="./Images/Icons/Shuffle.png" class="action-Btn" style="height:25px" onclick="shuffleEnemyModifierDeck()">
						<img src="./Images/Icons/Flip.png" class="action-Btn" style="height:25px" onclick="flipEnemyModifierDeck()">
						<img src="./Images/Icons/Bless.png" class="action-Btn" style="height:35px" onclick="modifyEnemyModifierDeck('Bless')">
						<img src="./Images/Icons/Curse.png" class="action-Btn" style="height:35px" onclick="modifyEnemyModifierDeck('Curse')">
					</div>
					<img id="EnemyModDeck" src="./Images/AttackModifiers/Back.png" style="height:auto;width:200px; cursor:pointer;" data-add="0">
					<img id="EnemyModDeckOld" src="./Images/AttackModifiers/Back.png" style="height:auto;width:200px; cursor:pointer;" data-add="0">
				</div>
				<div class="box-enemy" id="Enemy_Box" style="position:relative;"></div>
			</div>
		</div>

	</div>
	<script src="./characters_and_enemies.js"></script>
	<script src="./2e.js"></script>
	<script src="./elements_and_conditions.js"></script>
	<script src="./cards_and_decks.js"></script>
	<script src="./extras.js"></script>
</body>

</html>
