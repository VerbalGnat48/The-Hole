<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" contents="width=device-width, initial-scale=1.0">
	<title>Glassmorphism To-Do List App</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="js-css/two-do.css">
</head>
<body>
	<div class="container">
		<div class="todo-app">
			<h1>To-Do App</h1>
			<form class="input-area">
				<input type="text" id="task-input" placeholder="Add a new task...">
				<button type="submit" id="add-task-btn"><i class="fa-solid fa-plus"></i></button>
			</form>
			<div class="todos-container">
				<ul id="task-list"></ul>
			</div>
		</div>
	</div>
</body>
<script src="js-css/two-do.js"></script>

</html>
