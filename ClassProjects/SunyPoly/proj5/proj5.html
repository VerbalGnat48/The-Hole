<!DOCTYPE html>
<html lang="en">
<head>
	<title>To-Do</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./js-css/proj5.css">
</head>
<body>
	<div class="container">
		<div class="todo-app">
			<h2>To-Do List</h2>
			<div class="row">
				<input type="text" id="input-box" placeholder="Add your text">
				<button onclick="addTask()">Add</button>
				<button onclick="clearTask()">Reset</button>
			</div>
			<div class="row">
				<input type="datetime-local" id="due-date">
			</div>
			<ol reversed id="list-container"></ol>
		</div>
	</div>
	<script src="./js-css/proj5.js"></script>
</body>
</html>
