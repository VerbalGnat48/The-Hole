<!DOCTYPE html>
<html lang="en">
<head>
	<title>Medication Tracker</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./js-css/proj5.css">
</head>
<body>
	<div class="container">
		<div class="todo-app">
			<h2>Medication List</h2>
			<div class="row">
				<input type="text" id="input-box-plant" placeholder="Select and Name your plant!">
				<button onclick="addPlants()">Add</button>
			</div>
			<div class="plant-types" id="plantTypes">
				<input type="image" src="./Images/Plant01.png" id="one">
				<input type="image" src="./Images/Plant02.png" id="two">
				<input type="image" src="./Images/Plant03.png" id="three">
			</div>
			<div class="row">
				<input type="text" id="input-box" placeholder="Add your text">
				<button onclick="addTask()">Add</button>
				<button onclick="clearScreen()">Reset</button>
			</div>
			<div class="row">
				<input type="datetime-local" id="due-date">
			</div>
			<div class="plants" id="plants"></div>
			<div class="list-container">
				<ol id="task-list"></ol>
				<input type="file" accept="image/*" id="input-file" hidden>
			</div>
		</div>
	</div>
	<script src="./js-css/proj5.js"></script>
</body>
</html>
